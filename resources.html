<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Resources | HireReady</title>
    <meta name="description" content="Free interview question banks and career roadmaps.">
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>

<body>
    <div id="site-header"></div>
    <main>
        <section>
            <div class="wrap">
                <h1>Free resources</h1>
                <h2 id="roadmaps">Career roadmaps</h2>
                <div class="grid" id="rm"></div>
            </div>
        </section>
        <section class="alt">
            <div class="wrap">
                <h2 id="questions">Interview question banks</h2>
                <p>Tap a question to see a short answer hint. Add more in <code>js/resources-data.js</code>.</p>
                <div id="qb"></div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/main.js"></script>
    <script src="js/resources-data.js"></script>
    <script>
        document.getElementById("rm").innerHTML = ROADMAPS.map(r => `<div class="card"><h3>${r.t}</h3><ol>${r.s.map(x => "<li>" + x + "</li>").join("")}</ol></div>`).join("");
        document.getElementById("qb").innerHTML = Object.entries(QUESTIONS).map(([k, v]) => `<h3 style="margin-top:20px">${k}</h3>` + v.map(q => `<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("")).join("");
    </script>
</body>

</html>
