<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courses | HireReady</title><meta name="description" content="3-month training and internship program and short skill courses.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script src="js/config.js"></script></head><body><div id="site-header"></div><main>
<section><div class="wrap"><h1>Courses</h1><p class="lead">Register first, then pay through a secure link. You get a receipt automatically.</p>
<div id="program"></div><h2 id="short" style="margin-top:40px">Short skill courses</h2><div class="grid" id="courses"></div>
<h2 style="margin-top:40px">Add-ons</h2><div class="grid" id="addons"></div></div></section>
</main><div id="site-footer"></div><script src="js/main.js"></script><script>
const C=window.HR,p=C.program;
document.getElementById("program").innerHTML=`<div class="card"><span class="tag">Main program</span><h2>${p.name}</h2><div class="grid" style="margin:14px 0">
<div><strong>Duration</strong><br>${p.duration}</div><div><strong>Mode</strong><br>${p.mode}</div><div><strong>Fee</strong><br><span class="fee">${p.fee}</span></div><div><strong>Certificate</strong><br>${p.certificate}</div><div><strong>Mentor</strong><br>${p.mentor}</div></div>
<details open><summary>Syllabus</summary><ul>${p.syllabus.map(s=>"<li>"+s+"</li>").join("")}</ul></details>
<div class="row"><a class="btn" href="${C.links.register}">Register</a><a class="btn gold" href="${p.pay}">Pay after registering</a></div>
<p class="note" style="margin-top:14px">Group offer: 10% off when 10 students from one college join together. Ask us on WhatsApp.</p></div>`;
const row=(x,t)=>`<div class="card"><h3>${x.name}</h3><div class="fee">${x.fee}</div><p>${x.duration||""}</p><a class="btn ghost" href="${x.pay}">${t}</a></div>`;
document.getElementById("courses").innerHTML=C.courses.map(x=>row(x,"Enrol")).join("");
document.getElementById("addons").innerHTML=C.addons.map(x=>row(x,"Book")).join("");
</script></body></html>
